<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate 6-CH Chaser</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #10b981; --text: #f8fafc; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 600px; width: 100%; }
  .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom:10px; }
  button { padding: 12px; border: none; border-radius: 8px; background: #334155; color: white; cursor: pointer; font-weight: 600; width: 100%; }
  button:active { transform: scale(0.96); }
  .btn-blue { background: var(--primary); }
  .btn-green { background: var(--accent); }
  .btn-red { background: #ef4444; }
  .btn-purple { background: #8b5cf6; }
  .btn-yellow { background: #eab308; color: #000; }
  input[type="range"] { width: 100%; accent-color: var(--primary); }
  label { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
</style>
</head>
<body>

<div class="container">
  <div class="card" style="text-align: center;">
    <h2>⚡ PRO CHASER (6-CH)</h2>
    <button class="btn-blue" id="connectBtn" onclick="connectBLE()">PAIR BLUETOOTH</button>
  </div>

  <!-- Manual Control & Sleep Timer -->
  <div class="card">
    <div class="grid-2">
      <button class="btn-green" onclick="sendCmd('A,1')">ALL ON</button>
      <button class="btn-red" onclick="sendCmd('A,0')">ALL OFF</button>
    </div>
    <div class="grid-3" style="margin-top: 10px;">
      <button onclick="sendCmd('S,0,1')">CH 1</button>
      <button onclick="sendCmd('S,1,1')">CH 2</button>
      <button onclick="sendCmd('S,2,1')">CH 3</button>
      <button onclick="sendCmd('S,3,1')">CH 4</button>
      <button onclick="sendCmd('S,4,1')">CH 5</button>
      <button onclick="sendCmd('S,5,1')">CH 6</button>
    </div>
    <div class="grid-2">
      <button onclick="sendCmd('T,900')">⏱ Sleep 15m</button>
      <button onclick="sendCmd('T,0')">⏱ Cancel Timer</button>
    </div>
  </div>

  <!-- Automation & FX Engine -->
  <div class="card">
    <button class="btn-purple" onclick="sendCmd('D,1')" style="margin-bottom:10px;">🎧 AUTO-DJ (Auto Playlist)</button>
    <div class="grid-2">
      <button onclick="sendCmd('D,0'); sendCmd('M,forward')">Forward</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,bounce')">Bounce</button>
    </div>
    
    <label>Speed (BPM/Delay)</label>
    <div style="display:flex; gap:10px;">
      <input type="range" min="50" max="1500" value="700" onchange="sendCmd('V,'+this.value)">
      <button class="btn-yellow" style="width:80px;" onclick="tapBeat()">TAP</button>
    </div>

    <label>Pulse Width (Strobe Effect)</label>
    <input type="range" min="5" max="100" value="100" onchange="sendCmd('P,'+this.value)">
  </div>

  <!-- Advanced External Sync -->
  <div class="card">
    <label>Browser Sync FX (Direct Mode)</label>
    <div class="grid-2" style="margin-top: 5px;">
      <button onclick="startMusicSync()">🎵 Mic Sync</button>
      <button onclick="startAmbilight()">🖥 Screen Sync</button>
    </div>
    <video id="screenVideo" style="display:none;" autoplay></video>
  </div>
</div>

<script>
  let bleChar;
  
  async function connectBLE() {
    try {
      const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ESP32_LED_CHASER' }], optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] });
      const server = await dev.gatt.connect();
      const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
      bleChar = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
      document.getElementById('connectBtn').innerText = "CONNECTED";
      document.getElementById('connectBtn').style.background = "#10b981";
    } catch(e) { alert("BLE Error: " + e); }
  }

  async function sendCmd(cmd) {
    if(!bleChar) return;
    stopSync(); 
    await bleChar.writeValue(new TextEncoder().encode(cmd));
  }

  // --- TAP-TO-BEAT ---
  let tapTimes = [];
  function tapBeat() {
    let now = Date.now();
    tapTimes.push(now);
    if(tapTimes.length > 4) tapTimes.shift();
    if(tapTimes.length === 4) {
      let delay = (tapTimes[3] - tapTimes[0]) / 3;
      sendCmd('V,' + Math.round(delay));
    }
  }

  // --- ADVANCED SYNC GLOBALS ---
  let syncRunning = false;
  let audioContext, mediaStream;
  function stopSync() { syncRunning = false; }

  async function sendDirectMask(mask) {
    if(!bleChar || !syncRunning) return;
    bleChar.writeValue(new TextEncoder().encode('C,' + mask));
  }

  // --- 1. MUSIC SYNC (BROWSER MIC) FOR 6-CH ---
  async function startMusicSync() {
    await sendCmd('M,direct'); 
    syncRunning = true;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new AudioContext();
      let source = audioContext.createMediaStreamSource(mediaStream);
      let analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      let data = new Uint8Array(analyser.frequencyBinCount);

      function loop() {
        if(!syncRunning) return;
        analyser.getByteFrequencyData(data);
        
        let m = 0;
        // Map frequencies to 6 channels (Bass to Treble)
        if(data[2] > 180) m |= 1;   // CH 1 (Sub Bass)
        if(data[5] > 160) m |= 2;   // CH 2 (Bass)
        if(data[10] > 150) m |= 4;  // CH 3 (Low Mid)
        if(data[16] > 140) m |= 8;  // CH 4 (Mid)
        if(data[24] > 130) m |= 16; // CH 5 (High Mid)
        if(data[35] > 120) m |= 32; // CH 6 (Treble)
        
        sendDirectMask(m);
        setTimeout(() => requestAnimationFrame(loop), 50); 
      }
      loop();
    } catch(e) { alert("Mic access denied!"); syncRunning = false; }
  }

  // --- 2. AMBILIGHT SCREEN SYNC (PC ONLY) FOR 6-CH ---
  async function startAmbilight() {
    await sendCmd('M,direct'); 
    syncRunning = true;
    try {
      let stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      let video = document.getElementById('screenVideo');
      video.srcObject = stream;
      
      let canvas = document.createElement('canvas');
      let ctx = canvas.getContext('2d');
      canvas.width = 6; canvas.height = 1; // 6 zones for 6 channels

      function loop() {
        if(!syncRunning) return;
        ctx.drawImage(video, 0, 0, 6, 1);
        let img = ctx.getImageData(0, 0, 6, 1).data;
        let m = 0;
        
        for(let i=0; i<6; i++) {
          let bright = (img[i*4] + img[i*4+1] + img[i*4+2]) / 3;
          if(bright > 100) m |= (1 << i);
        }
        sendDirectMask(m);
        setTimeout(() => requestAnimationFrame(loop), 100);
      }
      video.onplay = loop;
    } catch(e) { alert("Screen access denied/Not supported."); syncRunning = false; }
  }
</script>
</body>
</html>
