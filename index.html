<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate 6-CH Chaser</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #10b981; --text: #f8fafc; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 600px; width: 100%; }
  .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom:10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom:15px; }
  
  button { padding: 12px; border: none; border-radius: 8px; background: #334155; color: white; cursor: pointer; font-weight: 600; width: 100%; font-size:13px; }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-blue { background: var(--primary); font-size:15px; }
  .btn-green { background: var(--accent); }
  .btn-red { background: #ef4444; }
  .btn-purple { background: #8b5cf6; }
  .btn-yellow { background: #eab308; color: #000; font-size:15px; }
  
  input[type="range"] { width: 100%; accent-color: var(--primary); margin-top:5px; margin-bottom:10px; }
  label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight:bold; display:block; }

  .draw-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 5px; margin-bottom: 15px; }
  .draw-cell { height: 35px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; cursor: pointer; transition: 0.1s; }
  .active-cell { background: var(--accent); box-shadow: 0 0 10px var(--accent); border-color: var(--accent); }
  .grid-header { text-align: center; font-size: 10px; color: #94a3b8; padding-bottom: 5px; }
</style>
</head>
<body>

<div class="container">
  <div class="card" style="text-align: center;">
    <h2>⚡ PRO CHASER (6-CH)</h2>
    <button class="btn-blue" id="connectBtn" onclick="connectBLE()">PAIR BLUETOOTH</button>
  </div>

  <div class="card" id="controls" style="opacity: 0.5; pointer-events: none;">
    <div class="grid-2">
      <button class="btn-green" onclick="sendCmd('A,1')">ALL ON</button>
      <button class="btn-red" onclick="sendCmd('A,0')">ALL OFF</button>
    </div>
    
    <div class="grid-4" style="margin-top:15px;">
      <button onclick="sendCmd('D,0'); sendCmd('M,forward')">Forward</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,reverse')">Reverse</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,alternate')">Alternate</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,pair')">Pair</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,bounce')">Bounce</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,fill')">Fill</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,random')">Random</button>
      <button onclick="sendCmd('D,0'); sendCmd('M,sparkle')">Sparkle</button>
    </div>

    <button class="btn-purple" onclick="sendCmd('D,1')" style="margin-bottom:15px;">🎧 AUTO-DJ PLAYLIST</button>
    
    <label>Speed (BPM / Chase Delay)</label>
    <div style="display:flex; gap:10px;">
      <input type="range" min="30" max="1500" value="700" onchange="sendCmd('V,'+this.value)">
      <button class="btn-yellow" style="width:90px; padding:10px;" onclick="tapBeat()">TAP</button>
    </div>

    <label>Pulse Width (Strobe Effect)</label>
    <input type="range" min="5" max="100" value="100" onchange="sendCmd('P,'+this.value)">
    
    <div style="margin-top:20px; border-top: 1px solid #334155; padding-top:15px;">
      <label>Draw Mode (Custom Sequence)</label>
      <div class="draw-grid" id="drawGrid"></div>
      <div class="grid-2">
        <button onclick="clearGrid()">Clear Grid</button>
        <button class="btn-green" onclick="playCustom()">▶ Play Custom</button>
      </div>
    </div>
    
    <div style="margin-top:20px; border-top: 1px solid #334155; padding-top:15px;">
      <label>Browser Sync FX (Direct Mode)</label>
      <div class="grid-2" style="margin-top: 5px; margin-bottom: 15px;">
        <button onclick="startMusicSync()">🎵 Mic Sync</button>
        <button onclick="startAmbilight()">🖥 Screen Sync</button>
      </div>
      
      <label>Mic Sensitivity (For Music Sync)</label>
      <input type="range" min="0.5" max="3.0" step="0.1" value="1.2" onchange="micSensitivity = parseFloat(this.value)">
      <video id="screenVideo" style="display:none;" autoplay></video>
    </div>
  </div>
</div>

<script>
  let bleDevice, bleChar;
  let cmdQueue = [];
  let isWriting = false;
  let syncRunning = false;
  let audioContext, mediaStream;
  let micSensitivity = 1.2;

  function unlockUI() {
    document.getElementById('controls').style.opacity = "1";
    document.getElementById('controls').style.pointerEvents = "auto";
  }

  function lockUI() {
    document.getElementById('controls').style.opacity = "0.5";
    document.getElementById('controls').style.pointerEvents = "none";
    document.getElementById('connectBtn').innerText = "PAIR BLUETOOTH";
    document.getElementById('connectBtn').style.background = "var(--primary)";
    stopSync();
  }

  function sendCmd(cmd) {
    if(!bleChar) return;
    stopSync();
    cmdQueue.push(cmd);
    processQueue();
  }

  async function processQueue() {
    if(isWriting || cmdQueue.length === 0) return;
    isWriting = true;
    let nextCmd = cmdQueue.shift();
    try { await bleChar.writeValueWithoutResponse(new TextEncoder().encode(nextCmd)); } catch(e) {}
    isWriting = false;
    setTimeout(processQueue, 25); 
  }

  async function connectBLE() {
    try {
      bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ESP32_LED_CHASER' }], optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b'] });
      bleDevice.addEventListener('gattserverdisconnected', lockUI);
      
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
      bleChar = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
      
      document.getElementById('connectBtn').innerText = "CONNECTED";
      document.getElementById('connectBtn').style.background = "#10b981";
      unlockUI();
    } catch(e) { alert("BLE Connection Error: " + e.message); }
  }

  function initGrid() {
    let grid = document.getElementById("drawGrid");
    grid.innerHTML = "";
    for(let c=1; c<=6; c++) grid.innerHTML += `<div class="grid-header">CH ${c}</div>`;
    for(let r=0; r<8; r++) { 
      for(let c=0; c<6; c++) { 
        grid.innerHTML += `<div class="draw-cell" id="cell-${r}-${c}" onclick="this.classList.toggle('active-cell')"></div>`;
      }
    }
  }
  
  function clearGrid() { document.querySelectorAll('.draw-cell').forEach(cell => cell.classList.remove('active-cell')); }

  function playCustom() {
    for(let r=0; r<8; r++) {
      let mask = 0;
      for(let c=0; c<6; c++) if(document.getElementById(`cell-${r}-${c}`).classList.contains('active-cell')) mask |= (1 << c);
      sendCmd(`W,${r},${mask}`); 
    }
    sendCmd('L,8'); 
  }
  initGrid();

  let tapTimes = [];
  function tapBeat() {
    let now = Date.now();
    tapTimes.push(now);
    if(tapTimes.length > 4) tapTimes.shift();
    if(tapTimes.length === 4) {
      let delay = (tapTimes[3] - tapTimes[0]) / 3;
      sendCmd('V,' + Math.round(delay));
    }
  }

  function stopSync() { syncRunning = false; }

  async function sendDirectMask(mask) {
    if(!bleChar || !syncRunning) return;
    try { await bleChar.writeValueWithoutResponse(new TextEncoder().encode('C,' + mask)); } catch(e) {}
  }

  async function startMusicSync() {
    if (!window.isSecureContext) return alert("Run via HTTPS or localhost for mic access.");
    sendCmd('M,direct'); 
    syncRunning = true;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      let source = audioContext.createMediaStreamSource(mediaStream);
      let analyser = audioContext.createAnalyser();
      analyser.fftSize = 256; 
      source.connect(analyser);
      let data = new Uint8Array(analyser.frequencyBinCount);

      function getBandMax(start, end) {
        let max = 0;
        for(let i=start; i<end; i++) if(data[i] > max) max = data[i];
        return max;
      }

      function loop() {
        if(!syncRunning) return;
        analyser.getByteFrequencyData(data);
        let totalVol = 0;
        for(let i=0; i<50; i++) totalVol += data[i];
        let avgVol = totalVol / 50;
        let threshold = Math.max(35, avgVol * (2.5 - micSensitivity));
        let m = 0;
        if (getBandMax(1, 4) > threshold * 0.8) m |= 1;     
        if (getBandMax(4, 9) > threshold * 0.9) m |= 2;     
        if (getBandMax(9, 16) > threshold * 1.0) m |= 4;    
        if (getBandMax(16, 26) > threshold * 1.1) m |= 8;   
        if (getBandMax(26, 40) > threshold * 1.2) m |= 16;  
        if (getBandMax(40, 70) > threshold * 1.3) m |= 32;  
        sendDirectMask(m);
        setTimeout(() => requestAnimationFrame(loop), 40); 
      }
      loop();
    } catch(e) { alert("Mic Error: " + e.message); syncRunning = false; }
  }

  async function startAmbilight() {
    if (!window.isSecureContext) return alert("Run via HTTPS or localhost for screen capture.");
    sendCmd('M,direct'); 
    syncRunning = true;
    try {
      let stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      let video = document.getElementById('screenVideo');
      video.srcObject = stream;
      let canvas = document.createElement('canvas');
      let ctx = canvas.getContext('2d', { willReadFrequently: true });
      canvas.width = 6; canvas.height = 1;

      function loop() {
        if(!syncRunning) return;
        ctx.drawImage(video, 0, 0, 6, 1);
        let img = ctx.getImageData(0, 0, 6, 1).data;
        let m = 0;
        for(let i=0; i<6; i++) {
          let bright = (img[i*4] + img[i*4+1] + img[i*4+2]) / 3;
          if(bright > 100) m |= (1 << i);
        }
        sendDirectMask(m);
        setTimeout(() => requestAnimationFrame(loop), 100);
      }
      video.onplay = loop;
    } catch(e) { alert("Screen Sync Error: " + e.message); syncRunning = false; }
  }
</script>
</body>
</html>
